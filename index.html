<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HTML File Viewer</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1c2230;--mute:#667085;--line:#d9dde5;--accent:#2457d6;--accent-ink:#fff;--code:#0f172a;--code-ink:#dbe4f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--panel:#1b2030;--ink:#e6e9f0;--mute:#98a1b3;--line:#2e3548;--accent:#7aa2ff;--accent-ink:#0b1020;--code:#0b0e15;--code-ink:#cfd8ea}}
:root[data-theme="dark"]{--bg:#12151c;--panel:#1b2030;--ink:#e6e9f0;--mute:#98a1b3;--line:#2e3548;--accent:#7aa2ff;--accent-ink:#0b1020;--code:#0b0e15;--code-ink:#cfd8ea}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0 8px 0 0;font-weight:650}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--accent)}
button:focus-visible,.btn:focus-within,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#name{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:30ch}
main{flex:1;min-height:0;position:relative;display:flex}
#drop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:24px;color:var(--mute);border:2px dashed var(--line);margin:16px;border-radius:14px;background:var(--panel)}
#drop.over{border-color:var(--accent);color:var(--ink)}
#drop strong{color:var(--ink);font-size:18px}
#frame{flex:1;border:0;background:#fff;width:100%}
#src{flex:1;margin:0;padding:16px;overflow:auto;background:var(--code);color:var(--code-ink);font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre;tab-size:2}
textarea{width:min(520px,90%);height:110px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px;font:13px ui-monospace,Menlo,monospace}
[hidden]{display:none!important}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
</style>
</head>
<body>
<header>
  <h1>HTML File Viewer</h1>
  <label class="btn primary">Open file<input type="file" id="file" accept=".html,.htm,text/html"></label>
  <span id="name"></span>
  <div class="tabs" id="tabs" hidden>
    <button data-v="preview" aria-pressed="true">Preview</button>
    <button data-v="source" aria-pressed="false">Source</button>
    <button id="clear">Clear</button>
  </div>
</header>
<main>
  <div id="drop">
    <strong>Drop an HTML file here</strong>
    <span>or use Open file. Files are read in your browser and never uploaded.</span>
    <textarea id="paste" placeholder="Or paste HTML code here"></textarea>
    <button id="render">Render pasted HTML</button>
  </div>
  <iframe id="frame" title="Preview" sandbox="allow-scripts allow-forms allow-modals allow-popups" hidden></iframe>
  <pre id="src" hidden></pre>
</main>
<script>
const $=id=>document.getElementById(id);
const frame=$('frame'),src=$('src'),drop=$('drop'),tabs=$('tabs');
function show(html,name){
  frame.srcdoc=html;
  src.textContent=html;
  $('name').textContent=name||'';
  drop.hidden=true;tabs.hidden=false;
  setView('preview');
}
function setView(v){
  frame.hidden=v!=='preview';src.hidden=v!=='source';
  tabs.querySelectorAll('button[data-v]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
}
function load(f){
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>show(r.result,f.name);
  r.readAsText(f);
}
$('file').addEventListener('change',e=>load(e.target.files[0]));
tabs.addEventListener('click',e=>{if(e.target.dataset.v)setView(e.target.dataset.v)});
$('clear').onclick=()=>{frame.srcdoc='';frame.hidden=src.hidden=true;drop.hidden=false;tabs.hidden=true;$('name').textContent='';$('file').value=''};
$('render').onclick=()=>{const t=$('paste').value.trim();if(t)show(t,'Pasted HTML')};
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
document.addEventListener('drop',e=>load(e.dataTransfer.files[0]));
</script>
</body>
</html>
